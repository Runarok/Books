<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Runarok — Books</title>
  <meta
    name="description"
    content="A collection of books, guides, thoughts, experiments, and other works."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">

      <a href="#" class="brand">
        <span class="brand-mark">R</span>
        <span>Runarok</span>
      </a>

      <button
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle theme"
        title="Toggle theme"
      >
        <span id="themeIcon">☾</span>
      </button>

    </div>
  </header>

  <main class="container">

    <section class="hero">

      <div class="hero-content">
        <p class="eyebrow">A personal library</p>

        <h1>
          Books, thoughts<br />
          <span>& everything between.</span>
        </h1>

        <p class="hero-description">
          A collection of ideas, reflections, guides, experiments,
          and things worth putting into words.
        </p>
      </div>

      <div class="library-stat">
        <span id="bookCount">0</span>
        <small>works</small>
      </div>

    </section>

    <section class="controls">

      <div class="search-wrapper">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search books..."
          autocomplete="off"
        />
      </div>

      <div class="filters" id="filters"></div>

    </section>

    <section class="library">

      <div class="section-heading">
        <div>
          <p class="eyebrow">Library</p>
          <h2 id="sectionTitle">All works</h2>
        </div>

        <span id="resultCount" class="result-count"></span>
      </div>

      <div id="booksGrid" class="books-grid"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">⌁</div>
        <h3>Nothing found</h3>
        <p>Try another title, keyword, or category.</p>
      </div>

    </section>

  </main>

  <footer>
    <div class="footer-inner">
      <span>Runarok</span>
      <span>·</span>
      <span id="footerYear"></span>
    </div>
  </footer>

  <script src="books.json"></script>
  <script src="app.js"></script>

</body>
</html>
