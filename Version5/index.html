<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>RunarokHrafn — Books</title>

        <meta
            name="description"
            content="A collection of books, guides, thoughts, and creative works by RunarokHrafn."
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>

    <body class="theme-dark">
        <!-- Ambient background -->
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <!-- Header -->
        <header class="site-header">
            <div class="header-inner">
                <a href="https://github.com/Runarok/Books" target="_blank" rel="noopener noreferrer" class="brand">
                    <img src="https://avatars.githubusercontent.com/u/191216225" alt="RunarokHrafn" class="avatar" />

                    <div class="brand-text">
                        <span class="brand-name">RunarokHrafn</span>
                        <span class="brand-subtitle">Books</span>
                    </div>
                </a>

                <div class="header-right">
                    <div class="works-count" title="Total works">
                        <div>
                            <strong id="worksCount">0</strong>
                            <span>works</span>
                        </div>
                    </div>

                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
                        <span class="theme-icon" id="themeIcon">☾</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="main-container">
            <!-- Intro -->
            <section class="intro">
                <div>
                    <p class="eyebrow">PERSONAL LIBRARY</p>

                    <h1>
                        Books, thoughts<br />
                        <span>&amp; everything between.</span>
                    </h1>

                    <p class="intro-text">A growing collection of books, essays, guides, experiments, and ideas.</p>
                </div>
            </section>

            <!-- Search + filters -->
            <section class="controls">
                <div class="search-container">
                    <span class="search-icon">⌕</span>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search books, ideas, guides..."
                        autocomplete="off"
                    />

                    <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">×</button>
                </div>

                <!-- Main categories -->
                <div class="category-container" id="mainCategories" aria-label="Categories"></div>

                <!-- Subcategories -->
                <div class="subcategory-container" id="subCategories" aria-label="Subcategories"></div>
            </section>

            <!-- Results -->
            <section class="results-section">
                <div class="results-header">
                    <div>
                        <span class="results-label">LIBRARY</span>

                        <h2 id="resultsTitle">All works</h2>
                    </div>

                    <span id="resultsCount" class="results-count"> 0 works </span>
                </div>

                <div id="booksGrid" class="books-grid"></div>

                <div id="emptyState" class="empty-state" hidden>
                    <div class="empty-icon">⌕</div>

                    <h3>No works found</h3>

                    <p>Try another search or category.</p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <span>
                Built with curiosity by
                <a href="https://github.com/Runarok" target="_blank" rel="noopener noreferrer"> RunarokHrafn </a>
            </span>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
