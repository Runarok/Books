<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RunarokHrafn — Books</title>

  <meta
    name="description"
    content="A personal collection of books, thoughts, guides and experiments by RunarokHrafn."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="ambient">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
  </div>

  <header class="header glass">

    <a
      href="https://github.com/Runarok/Books"
      target="_blank"
      rel="noopener noreferrer"
      class="identity"
    >
      <img
        src="https://avatars.githubusercontent.com/u/191216225"
        alt="RunarokHrafn"
        class="avatar"
      />

      <div class="identity-text">
        <strong>RunarokHrafn</strong>
        <span>Books</span>
      </div>
    </a>

    <button
      id="themeToggle"
      class="theme-toggle"
      aria-label="Toggle theme"
    >
      <span id="themeIcon">☾</span>
    </button>

  </header>


  <main class="container">

    <section class="hero">

      <div class="hero-copy">

        <div class="hero-label">
          <span></span>
          PERSONAL LIBRARY
        </div>

        <h1>
          Things I've
          <em>thought.</em>
        </h1>

        <p>
          Books, ideas, reflections, experiments, guides,
          and other things worth keeping around.
        </p>

      </div>

      <div class="hero-orb glass">

        <div class="orb-inner">
          <span id="bookCount">0</span>
          <small>works</small>
        </div>

      </div>

    </section>


    <section class="toolbar">

      <div class="search glass">

        <span class="search-symbol">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search the library..."
          autocomplete="off"
        />

        <span class="search-shortcut">/</span>

      </div>

      <div
        id="filters"
        class="filters"
      ></div>

    </section>


    <section class="library">

      <div class="library-heading">

        <div>
          <span class="section-label">COLLECTION</span>
          <h2 id="sectionTitle">All works</h2>
        </div>

        <span
          id="resultCount"
          class="result-count"
        ></span>

      </div>


      <div
        id="booksGrid"
        class="books-grid"
      ></div>


      <div
        id="emptyState"
        class="empty-state hidden"
      >
        <div class="empty-glass glass">
          <span>⌁</span>
        </div>

        <h3>Nothing here.</h3>

        <p>
          Try searching for something else.
        </p>
      </div>

    </section>

  </main>


  <footer>

    <a
      href="https://github.com/Runarok/Books"
      target="_blank"
      rel="noopener noreferrer"
    >
      RunarokHrafn
    </a>

    <span>·</span>

    <span id="year"></span>

  </footer>


  <script src="app.js"></script>

</body>
</html>
